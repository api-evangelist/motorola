name: Motorola
description: 'Motorola (motorola.com) is the consumer mobile-device brand operated by Motorola Mobility,
  a Lenovo company, producing Android smartphones (moto g, moto edge, and razr foldable lines), tablets,
  and accessories sold worldwide. It was originally added to the API Evangelist network as a venture-portfolio
  stub. On review, the consumer brand publishes no open public REST/HTTP API developer portal: the historical
  developer.motorola.com Moto Mods hardware SDK (for the modular Moto Z) is no longer reachable, and no
  OpenAPI, AsyncAPI, or well-known discovery surface was found. Enterprise and public-safety APIs are
  offered separately by Motorola Solutions, Inc. (docs.motorolasolutions.com), a distinct company, under
  a gated partner Application Developer Program.'
